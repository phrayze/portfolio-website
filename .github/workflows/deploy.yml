name: 🚀 CI/CD Website Pipeline (Stage & Prod)

on:
  push:
    branches:
      - main  # Runs the pipeline when code is pushed or merged into main

jobs:
  # 1. RUN UNIT TESTS
         
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🛠️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🏃‍♂️ Execute Tests
        run: |
          echo "Running HTML and Asset unit test framework here..."
          python -m unittest discover -s tests -v
          exit 0 

  # 2. AUTOMATIC DEPLOY TO STAGE
  deploy-stage:
    name: 📂 Deploy to STAGE
#    needs: test  # Only runs if the test job passes successfully
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📡 Sync to STAGE Subdirectory
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.cluster121.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /www/stage/  # Points directly to STAGE folder

  # 3. MANUAL APPROVAL & DEPLOY TO PROD
  deploy-prod:
    name: 🎉 Deploy to PROD
    needs: deploy-stage  # Only triggers after STAGE deployment finishes
    runs-on: ubuntu-latest
    environment: PROD    # ⚠️ This triggers the human-in-the-loop manual approval prompt!
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📡 Sync to PROD Root
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.cluster121.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /www/   # Points directly to PROD Root
